# =============================================================
# APPLICATION CONFIGURATION
# Project  : Backend API Algoritma Apriori - Apotek
# =============================================================

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:

  # -----------------------------------------------------------
  # ACTIVE PROFILE
  # -----------------------------------------------------------
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # -----------------------------------------------------------
  # JPA / HIBERNATE
  # -----------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100

  # -----------------------------------------------------------
  # FILE UPLOAD
  # -----------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# =============================================================
# KONFIGURASI CUSTOM APLIKASI
# =============================================================

app:

  # -----------------------------------------------------------
  # JWT Authentication
  # -----------------------------------------------------------
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  # -----------------------------------------------------------
  # Konfigurasi Upload File Excel
  # -----------------------------------------------------------
  upload:
    allowed-extensions:
      - .xlsx
      - .xls
    temp-dir: ${java.io.tmpdir}/apotek-uploads

# =============================================================
# SPRINGDOC / SWAGGER
# =============================================================

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    custom-css-url: /api/swagger-custom.css

  show-actuator: false

# =============================================================
# LOGGING
# =============================================================

logging:
  level:
    root: INFO
    com.skripsi.backend: DEBUG
    org.springframework.security: DEBUG
    com.skripsi.backend_api.security: DEBUG
    org.hibernate.SQL: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"